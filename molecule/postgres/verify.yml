---
# An uninstalled FreshRSS answers on every endpoint the tests would naturally
# reach for: `/` redirects, `/i/` returns 200 (the installation wizard) and
# `/api/greader.php` returns a bare "OK". None of that says the role produced a
# working instance. The assertions below all depend on FreshRSS actually being
# installed, on the credentials being real, and on an article having travelled
# from a feed into the database and back out through the authenticated API.
- name: Verify FreshRSS
  hosts: all
  become: true
  gather_facts: false

  vars:
    freshrss_molecule_base_url: http://localhost:80
    freshrss_molecule_sqlite_path: "/{{ freshrss_identifier }}/data/users/{{ freshrss_molecule_user }}/db.sqlite"

  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: freshrss_defaults

    - name: Wait for the FreshRSS service to become active
      ansible.builtin.systemd:
        name: "{{ freshrss_identifier }}.service"
      register: freshrss_service
      until: freshrss_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert the FreshRSS service is active
      ansible.builtin.assert:
        that: freshrss_service.status.ActiveState == 'active'
        fail_msg: "freshrss.service is not active ({{ freshrss_service.status.ActiveState }})"
        success_msg: "freshrss.service is active"

    - name: Retrieve the FreshRSS service log for debugging
      when: freshrss_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu {{ freshrss_identifier }}.service
      changed_when: false

    # A service that systemd reports as active is not necessarily serving yet,
    # hence the retries on this first request rather than on later ones.
    - name: Wait for FreshRSS to answer over HTTP
      ansible.builtin.uri:
        url: "{{ freshrss_molecule_base_url }}/i/"
        method: GET
        status_code: [200]
        return_content: true
      register: freshrss_landing_page
      until: freshrss_landing_page.status == 200
      retries: 120
      delay: 5

    # `/i/` serves the installation wizard before installation and the login
    # form afterwards, both with a 200. The title is what tells them apart, so
    # this is the assertion that a bare status check cannot make.
    - name: Assert FreshRSS is installed rather than showing the installation wizard
      ansible.builtin.assert:
        that:
          - "'<title>Login · FreshRSS</title>' in freshrss_landing_page.content"
          - "'Installation · FreshRSS' not in freshrss_landing_page.content"
        fail_msg: "FreshRSS is not installed - `/i/` is still serving the installation wizard"
        success_msg: "FreshRSS is installed and serving the login form"

    # The login page embeds a JSON blob describing the running application. It
    # is empty (`{}`) while FreshRSS is uninstalled, so the version can only be
    # read here once the instance is genuinely up.
    - name: Determine the FreshRSS version being served
      ansible.builtin.set_fact:
        freshrss_served_version: "{{ freshrss_landing_page.content | regex_search('(?<=\"version\":\")[^\"]+') }}"

    - name: Assert the FreshRSS version served matches the configured version
      ansible.builtin.assert:
        that:
          - freshrss_served_version | length > 0
          - freshrss_served_version is match(freshrss_defaults.freshrss_version | regex_escape)
        fail_msg: >-
          FreshRSS reports version `{{ freshrss_served_version }}`,
          which does not match the configured `{{ freshrss_defaults.freshrss_version }}`
        success_msg: "FreshRSS reports version `{{ freshrss_served_version }}`"

    # Proving the API rejects a wrong password first means the acceptance of the
    # right one below cannot be explained by the API letting everything through.
    - name: Attempt to authenticate against the Google Reader API with a wrong password
      ansible.builtin.uri:
        url: "{{ freshrss_molecule_base_url }}/api/greader.php/accounts/ClientLogin"
        method: POST
        body_format: form-urlencoded
        body:
          Email: "{{ freshrss_molecule_user }}"
          Passwd: "{{ freshrss_molecule_api_password }}-wrong"
        status_code: [401]
        return_content: true
      register: freshrss_api_bad_login

    - name: Assert the Google Reader API rejects a wrong password
      ansible.builtin.assert:
        that: freshrss_api_bad_login.status == 401
        fail_msg: "The Google Reader API did not reject a wrong password ({{ freshrss_api_bad_login.status }})"
        success_msg: "The Google Reader API rejects a wrong password"

    - name: Authenticate against the Google Reader API
      ansible.builtin.uri:
        url: "{{ freshrss_molecule_base_url }}/api/greader.php/accounts/ClientLogin"
        method: POST
        body_format: form-urlencoded
        body:
          Email: "{{ freshrss_molecule_user }}"
          Passwd: "{{ freshrss_molecule_api_password }}"
        status_code: [200]
        return_content: true
      register: freshrss_api_login

    - name: Determine the Google Reader API authentication token
      ansible.builtin.set_fact:
        freshrss_api_token: "{{ freshrss_api_login.content | regex_search('(?<=Auth=)\\S+') }}"

    - name: Assert the Google Reader API issued an authentication token
      ansible.builtin.assert:
        that:
          - freshrss_api_token | length > 0
          - freshrss_api_token is match(freshrss_molecule_user | regex_escape + '/')
        fail_msg: "The Google Reader API did not issue a usable token for `{{ freshrss_molecule_user }}`"
        success_msg: "The Google Reader API issued an authentication token"

    - name: Attempt to read articles from the Google Reader API without authenticating
      ansible.builtin.uri:
        url: "{{ freshrss_molecule_base_url }}/api/greader.php/reader/api/0/stream/contents/reading-list?output=json"
        method: GET
        status_code: [401]
      register: freshrss_api_anonymous_read

    - name: Assert the Google Reader API refuses to serve articles without authentication
      ansible.builtin.assert:
        that: freshrss_api_anonymous_read.status == 401
        fail_msg: "The Google Reader API served articles without authentication ({{ freshrss_api_anonymous_read.status }})"
        success_msg: "The Google Reader API refuses to serve articles without authentication"

    # The round trip: the sidecar served these articles over the container
    # network, FreshRSS fetched and stored them, and now hands them back.
    - name: Read the articles fetched from the sidecar feed through the Google Reader API
      ansible.builtin.uri:
        url: "{{ freshrss_molecule_base_url }}/api/greader.php/reader/api/0/stream/contents/reading-list?output=json&n=100"
        method: GET
        headers:
          Authorization: "GoogleLogin auth={{ freshrss_api_token }}"
        status_code: [200]
        return_content: true
      register: freshrss_api_stream

    - name: Assert the articles from the sidecar feed came back through the Google Reader API
      ansible.builtin.assert:
        that:
          - freshrss_api_stream_titles | length == freshrss_molecule_article_titles | length
          - freshrss_molecule_article_titles | difference(freshrss_api_stream_titles) | length == 0
          - freshrss_molecule_feed_title in freshrss_api_stream_origins
        fail_msg: >-
          The Google Reader API returned {{ freshrss_api_stream_titles }},
          which is not the {{ freshrss_molecule_article_titles }} served by the sidecar
        success_msg: "The Google Reader API returned the articles served by the sidecar"
      vars:
        # The item list is spelled out in both expressions rather than shared
        # through a third variable: one `vars:` entry consumed by another that
        # maps over it is what ansible-lint's jinja rule cannot render.
        # `.get()` rather than `['items']` because the latter falls back to
        # Jinja attribute lookup and resolves to the dict's own `items` method.
        freshrss_api_stream_titles: >-
          {{ (freshrss_api_stream.content | from_json).get('items', []) | map(attribute='title') | list }}
        freshrss_api_stream_origins: >-
          {{ (freshrss_api_stream.content | from_json).get('items', []) | map(attribute='origin') | map(attribute='title') | list }}

    # Reading the same round trip back out of the database, through FreshRSS's
    # own accounting, rather than only through the API that just served it.
    - name: Retrieve the FreshRSS account summary from the database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --workdir=/var/www/FreshRSS
          - "{{ freshrss_identifier }}"
          - php
          - ./cli/user-info.php
          - --user
          - "{{ freshrss_molecule_user }}"
          - --json
      register: freshrss_user_info
      changed_when: false

    - name: Assert the database holds the subscription and its articles
      ansible.builtin.assert:
        that:
          - freshrss_user_info_account.feeds | int == 1
          - freshrss_user_info_account.unreads | int == freshrss_molecule_article_titles | length
        fail_msg: >-
          The database holds {{ freshrss_user_info_account.feeds }} feed(s) and
          {{ freshrss_user_info_account.unreads }} unread article(s), expected 1 and
          {{ freshrss_molecule_article_titles | length }}
        success_msg: "The database holds the subscription and its articles"
      vars:
        freshrss_user_info_account: "{{ (freshrss_user_info.stdout | from_json) | selectattr('user', 'equalto', freshrss_molecule_user) | first }}"

    # A scenario named after a database is worth nothing unless it proves that
    # database is the one in use. FreshRSS falls back to SQLite readily, so the
    # articles are looked for in Postgres itself, and the SQLite database
    # that a fallback would have produced is required to be absent.
    - name: Check whether FreshRSS fell back to a SQLite database
      ansible.builtin.stat:
        path: "{{ freshrss_molecule_sqlite_path }}"
      register: freshrss_sqlite_database

    - name: Assert FreshRSS did not fall back to SQLite
      ansible.builtin.assert:
        that: not freshrss_sqlite_database.stat.exists
        fail_msg: "FreshRSS fell back to SQLite - it created {{ freshrss_molecule_sqlite_path }}"
        success_msg: "FreshRSS did not fall back to SQLite"

    # Queried through the Postgres role's own CLI helper, over the same Unix
    # socket the FreshRSS container is given.
    - name: List the articles stored in Postgres
      ansible.builtin.command:
        argv:
          - /postgres/bin/cli-non-interactive
          - --dbname={{ freshrss_database_name }}
          - --tuples-only
          - --no-align
          - --command=select title from {{ freshrss_molecule_table_prefix }}{{ freshrss_molecule_user }}_entry order by title
      register: freshrss_backend_query
      changed_when: false

    - name: Assert the articles from the sidecar feed are stored in Postgres
      ansible.builtin.assert:
        that:
          - freshrss_backend_titles | length == freshrss_molecule_article_titles | length
          - freshrss_molecule_article_titles | difference(freshrss_backend_titles) | length == 0
        fail_msg: >-
          Postgres holds {{ freshrss_backend_titles }}, which is not the
          {{ freshrss_molecule_article_titles }} served by the sidecar
        success_msg: "Postgres holds the articles served by the sidecar"
      vars:
        freshrss_backend_titles: "{{ freshrss_backend_query.stdout_lines }}"

    - name: Show the FreshRSS verification summary
      ansible.builtin.debug:
        msg:
          - "FreshRSS systemd: {{ freshrss_service.status.ActiveState }}"
          - "FreshRSS version: {{ freshrss_served_version }}"
          - "FreshRSS database: postgres"
          - "FreshRSS articles fetched from the sidecar: {{ freshrss_molecule_article_titles | length }}"
