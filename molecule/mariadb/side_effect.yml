---
# Gives the freshly installed FreshRSS something real to do: a feed served by a
# sidecar container on the FreshRSS container network, subscribed to and fetched
# through FreshRSS's own CLI. verify.yml then asserts that the articles arrived.
#
# The feed is served locally rather than fetched from the internet, so the tests
# do not depend on a third party being reachable or on its content staying put.
- name: Seed FreshRSS with a feed served by a local sidecar
  hosts: all
  become: true
  gather_facts: false

  vars:
    freshrss_molecule_opml_host_path: "/{{ freshrss_identifier }}/data/molecule-feeds.opml"
    freshrss_molecule_opml_container_path: /var/www/FreshRSS/data/molecule-feeds.opml

  tasks:
    - name: Run the checks shared by all FreshRSS scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/side_effect_tasks.yml"
