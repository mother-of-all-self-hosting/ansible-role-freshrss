---
# An uninstalled FreshRSS answers on every endpoint the tests would naturally
# reach for: `/` redirects, `/i/` returns 200 (the installation wizard) and
# `/api/greader.php` returns a bare "OK". None of that says the role produced a
# working instance. The assertions below all depend on FreshRSS actually being
# installed, on the credentials being real, and on an article having travelled
# from a feed into the database and back out through the authenticated API.
- name: Verify FreshRSS
  hosts: all
  become: true
  gather_facts: false

  vars:
    freshrss_molecule_base_url: http://localhost:80
    freshrss_molecule_sqlite_path: "/{{ freshrss_identifier }}/data/users/{{ freshrss_molecule_user }}/db.sqlite"

    freshrss_verify_units:
      - freshrss.service

  tasks:
    - name: Verify that FreshRSS works
      block:
        - name: Run the shared FreshRSS verification tasks
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        # Without this, the scenario would pass just the same if FreshRSS had
        # quietly been installed onto a different database than the one configured.
        - name: Check whether FreshRSS created a SQLite database
          ansible.builtin.stat:
            path: "{{ freshrss_molecule_sqlite_path }}"
          register: freshrss_sqlite_database

        - name: Assert FreshRSS stores its data in SQLite
          ansible.builtin.assert:
            that:
              - freshrss_sqlite_database.stat.exists
              - freshrss_sqlite_database.stat.size > 0
            fail_msg: "FreshRSS did not create a SQLite database at {{ freshrss_molecule_sqlite_path }}"
            success_msg: "FreshRSS stores its data in SQLite"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "freshrss_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: freshrss_restarts_before
              loop: "{{ freshrss_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: freshrss_restarts_after
              loop: "{{ freshrss_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - freshrss_restarts_after.results | map(attribute='status.NRestarts') | list == freshrss_restarts_before.results | map(attribute='status.NRestarts') | list
                  - freshrss_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in freshrss_verify_units | zip(freshrss_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in freshrss_verify_units | zip(freshrss_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in freshrss_verify_units | zip(freshrss_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the FreshRSS verification summary
          ansible.builtin.debug:
            msg:
              - "FreshRSS systemd: {% for unit, state in freshrss_verify_units | zip(freshrss_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "FreshRSS restarts: {% for unit, restarts in freshrss_verify_units | zip(freshrss_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "FreshRSS version: {{ freshrss_served_version }}"
              - "FreshRSS database: sqlite ({{ freshrss_sqlite_database.stat.size }} bytes)"
              - "FreshRSS articles fetched from the sidecar: {{ freshrss_molecule_article_titles | length }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the FreshRSS systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=freshrss.service
          register: freshrss_service_log
          changed_when: false

        - name: Show the FreshRSS systemd service log
          ansible.builtin.debug:
            var: freshrss_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "FreshRSS verification failed. The systemd service log is printed above."
