---
- name: Ensure the feed sidecar document root exists
  ansible.builtin.file:
    path: "{{ freshrss_molecule_sidecar_root }}"
    state: directory
    mode: "0755"

- name: Ensure the feed served by the sidecar is present
  ansible.builtin.copy:
    dest: "{{ freshrss_molecule_sidecar_root }}/feed.xml"
    mode: "0644"
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <rss version="2.0">
        <channel>
          <title>{{ freshrss_molecule_feed_title }}</title>
          <link>http://{{ freshrss_molecule_sidecar_identifier }}/</link>
          <description>A static feed served locally for the Molecule tests.</description>
          {% for title in freshrss_molecule_article_titles %}
          <item>
            <title>{{ title }}</title>
            <link>http://{{ freshrss_molecule_sidecar_identifier }}/{{ loop.index }}</link>
            <guid isPermaLink="false">molecule-sidecar-article-{{ loop.index }}</guid>
            <pubDate>Mon, 24 Aug 2026 1{{ loop.index }}:00:00 +0000</pubDate>
            <description>Article body {{ loop.index }}.</description>
          </item>
          {% endfor %}
        </channel>
      </rss>

# Written into the data directory the role bind-mounts into the container,
# which is the one place both the host and FreshRSS can see it. `docker cp`
# would not do: the container's `/tmp` is a tmpfs the copy does not reach.
- name: Ensure the OPML file subscribing to the sidecar feed is present
  ansible.builtin.copy:
    dest: "{{ freshrss_molecule_opml_host_path }}"
    mode: "0644"
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <opml version="2.0">
        <head><title>Molecule</title></head>
        <body>
          <outline text="{{ freshrss_molecule_feed_title }}" type="rss" xmlUrl="http://{{ freshrss_molecule_sidecar_identifier }}/feed.xml" />
        </body>
      </opml>

- name: Ensure the sidecar container image is pulled
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ freshrss_molecule_sidecar_container_image }}"
  register: freshrss_molecule_sidecar_pull
  changed_when: "'Downloaded newer image' in freshrss_molecule_sidecar_pull.stdout"

- name: Ensure no stale sidecar container is left behind
  ansible.builtin.command:
    argv:
      - docker
      - rm
      - -f
      - "{{ freshrss_molecule_sidecar_identifier }}"
  register: freshrss_molecule_sidecar_removal
  changed_when: freshrss_molecule_sidecar_removal.rc == 0
  failed_when: false

# Docker 28 and later block container-to-host-gateway traffic, so the
# sidecar joins the FreshRSS container network instead of being published
# on the host and reached from the outside.
- name: Ensure the sidecar container serving the feed is running
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --detach
      - --name={{ freshrss_molecule_sidecar_identifier }}
      - --network={{ freshrss_container_network }}
      - --mount=type=bind,src={{ freshrss_molecule_sidecar_root }},dst=/usr/share/nginx/html,ro
      - "{{ freshrss_molecule_sidecar_container_image }}"
  register: freshrss_molecule_sidecar_run
  changed_when: freshrss_molecule_sidecar_run.rc == 0

- name: Wait for the sidecar to start serving the feed
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ freshrss_molecule_sidecar_identifier }}"
      - wget
      - --quiet
      - --output-document=/dev/null
      - http://localhost/feed.xml
  register: freshrss_molecule_sidecar_probe
  until: freshrss_molecule_sidecar_probe.rc == 0
  retries: 30
  delay: 2
  changed_when: false

# The container entrypoint installs FreshRSS and creates the user while it
# boots, so the seeding below has to wait for that to have happened.
- name: Wait for the FreshRSS container entrypoint to have created the user
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --workdir=/var/www/FreshRSS
      - "{{ freshrss_identifier }}"
      - php
      - ./cli/list-users.php
  register: freshrss_molecule_users
  until: freshrss_molecule_users.rc == 0 and freshrss_molecule_user in freshrss_molecule_users.stdout
  retries: 60
  delay: 5
  changed_when: false

- name: Ensure FreshRSS is subscribed to the sidecar feed
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --workdir=/var/www/FreshRSS
      - "{{ freshrss_identifier }}"
      - php
      - ./cli/import-for-user.php
      - --user
      - "{{ freshrss_molecule_user }}"
      - --filename
      - "{{ freshrss_molecule_opml_container_path }}"
  register: freshrss_molecule_import
  changed_when: freshrss_molecule_import.rc == 0

- name: Ensure FreshRSS has fetched the sidecar feed
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --workdir=/var/www/FreshRSS
      - "{{ freshrss_identifier }}"
      - php
      - ./cli/actualize-user.php
      - --user
      - "{{ freshrss_molecule_user }}"
  register: freshrss_molecule_actualize
  changed_when: freshrss_molecule_actualize.rc == 0
